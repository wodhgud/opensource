name: observability

services:
  otelcol:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: otelcol
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./otelcol/config.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
      - "8888:8888"   # collector 자체 메트릭
    depends_on: [tempo, loki, prometheus]
    restart: unless-stopped

  tempo:
    image: grafana/tempo:latest
    container_name: tempo
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    user: "0"
    volumes:
      - ./tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo-data:/var/tempo
    ports:
      - "3200:3200"   # Tempo HTTP API
    restart: unless-stopped

  loki:
    image: grafana/loki:latest
    container_name: loki
    command: ["-config.file=/etc/loki/local-config.yaml"]
    volumes:
      - loki-data:/loki
    ports:
      - "3100:3100"
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-remote-write-receiver
      - --web.enable-otlp-receiver
      - --enable-feature=exemplar-storage
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    restart: unless-stopped

  alloy:
    image: grafana/alloy:latest
    container_name: alloy
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy-data:/var/lib/alloy/data
    ports:
      - "12345:12345" # Alloy UI
      - "14317:4317"  # OTLP gRPC (otelcol과 포트 충돌 방지)
      - "14318:4318"  # OTLP HTTP
    depends_on: [tempo, loki, prometheus]
    restart: unless-stopped

  pyroscope:
    image: grafana/pyroscope:latest
    container_name: pyroscope
    volumes:
      - pyroscope-data:/data
    ports:
      - "4040:4040"
    restart: unless-stopped

  postgres:
    image: postgres:17
    container_name: postgres
    environment:
      POSTGRES_DB: grafana
      POSTGRES_USER: grafana
      POSTGRES_PASSWORD: grafana
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U grafana -d grafana"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    container_name: postgres-exporter
    command:
      - --collector.postmaster
      - --collector.stat_checkpointer   # PostgreSQL 17+ 체크포인트 통계
    environment:
      DATA_SOURCE_NAME: postgresql://grafana:grafana@postgres:5432/grafana?sslmode=disable
    ports:
      - "9187:9187"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    environment:
      GF_DATABASE_TYPE: postgres
      GF_DATABASE_HOST: postgres:5432
      GF_DATABASE_NAME: grafana
      GF_DATABASE_USER: grafana
      GF_DATABASE_PASSWORD: grafana
      GF_DATABASE_SSL_MODE: disable
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      # [feature_toggles] grafanaAdvisor = true
      # (env 는 defaults.ini 에 있는 키만 덮어쓰므로 enable 키로 지정)
      GF_FEATURE_TOGGLES_ENABLE: grafanaAdvisor
      # Grafana Assistant (self-managed 는 Grafana Cloud 계정 연결 필요)
      GF_PLUGINS_PREINSTALL: grafana-assistant-app
    volumes:
      - grafana-storage:/var/lib/grafana
      - ./grafana/datasources.yaml:/etc/grafana/provisioning/datasources/observability.yaml:ro
      - ./grafana/dashboards.yaml:/etc/grafana/provisioning/dashboards/observability.yaml:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards/observability:ro
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  grafana-storage:
    external: true
  postgres-data:
  pyroscope-data:
  tempo-data:
  loki-data:
  prometheus-data:
  alloy-data:

networks:
  default:
    name: observability
