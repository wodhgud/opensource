load_module modules/ngx_otel_module.so;

events {}

http {
    otel_exporter {
        endpoint otelcol:4317;
    }
    otel_service_name nginx;
    otel_resource_attr deployment.environment demo;
    otel_trace on;
    # 상위 컨텍스트가 있으면 이어받고, 없으면 새로 만들어 upstream 으로 traceparent 전달
    otel_trace_context propagate;

    log_format trace '$remote_addr "$request" $status $request_time '
                     'trace_id=$otel_trace_id span_id=$otel_span_id';
    access_log /dev/stdout trace;

    # Docker DNS 로 매번 재조회 (java-app 재생성으로 IP 가 바뀌어도 502 가 나지 않도록)
    resolver 127.0.0.11 valid=10s ipv6=off;

    server {
        listen 80;

        location / {
            otel_span_name "static /";
            default_type text/plain;
            return 200 "nginx ok\n";
        }

        location /api/ {
            otel_span_name "proxy $request_method $uri";
            set $java_app http://java-app:8080;
            proxy_pass $java_app;
            proxy_set_header Host $host;
        }

        # /tomcat/xxx → tomcat-app:8080/tomcat-app/xxx
        location /tomcat/ {
            otel_span_name "proxy $request_method $uri";
            set $tomcat_app http://tomcat-app:8080;
            rewrite ^/tomcat/(.*)$ /tomcat-app/$1 break;
            proxy_pass $tomcat_app;
            proxy_set_header Host $host;
        }
    }
}
